name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Package the release tarball
        run: ./scripts/package-release.sh
      - name: Check the app icon renders as the artwork
        # package-release.sh already does this on the staged bundle. Repeated
        # here, against a second render, so the job fails loudly on the icon
        # rather than burying it in a packaging step that also does six other
        # things — the grey-plate failure this guards is invisible in the file,
        # so it is worth naming in the log.
        run: ./scripts/check-icon.sh dist/headless-spotify.app
      - name: The icon's mark is the symbol the menu bar shows
        # scripts/make-icon.swift cannot import MenuBarModel, so the two could
        # drift. One grep closes that gap: if the top-bar icon ever changes,
        # this fails and make-icon.swift is updated to match.
        run: |
          set -eu
          ICON_SYMBOL="$(sed -n 's/^let markSymbolName = "\(.*\)"$/\1/p' scripts/make-icon.swift)"
          BAR_SYMBOL="$(sed -n 's/.*visibleIconSymbolName = "\(.*\)".*/\1/p' Sources/HeadlessSpotifyBarKit/MenuBarModel.swift)"
          test -n "$ICON_SYMBOL" || { echo "could not read markSymbolName from make-icon.swift"; exit 1; }
          test -n "$BAR_SYMBOL" || { echo "could not read visibleIconSymbolName from MenuBarModel.swift"; exit 1; }
          if [ "$ICON_SYMBOL" != "$BAR_SYMBOL" ]; then
            echo "::error::the app icon draws '$ICON_SYMBOL' but the menu bar shows '$BAR_SYMBOL' — they are meant to be the same mark"
            exit 1
          fi
          echo "ok: the icon and the menu bar both use $ICON_SYMBOL"
      - name: Stage the cask against the tarball this build just made
        id: stage
        run: |
          # Not the step's stdout: `run:` only publishes what goes to
          # $GITHUB_OUTPUT, and an empty cask token here would leave
          # `brew style` with no file at all — which styles all of Homebrew
          # and fails for reasons that have nothing to do with the cask.
          echo "cask=$(./scripts/stage-cask-for-ci.sh)" >> "$GITHUB_OUTPUT"
      - name: Style the cask
        run: |
          # One offense is expected and unsatisfiable: Cask/InstallSteps on the
          # postflight block. Homebrew requires postflight_steps, whose DSL
          # exposes no way to run a command, and forbids suppressing the cop.
          # The cask says so at length where the block is; this is the one
          # command that checks everything else.
          brew style --except Cask/InstallSteps "${{ steps.stage.outputs.cask }}"
      - name: Audit the cask
        run: |
          # `brew audit` is the gate Homebrew actually enforces, and the only
          # one that looks at the artifact.
          #
          # The staging rewrite points the cask at a file:// URL so the audit
          # checks the tarball this job built instead of whatever is published.
          # A versioned https:// release URL never trips the one check a
          # file:// URL does — sha256_no_check_if_unversioned, which objects
          # that a cask pinned to no version must not carry a checksum — so
          # that single check is excluded here and only here.
          brew audit --cask --strict --except sha256_no_check_if_unversioned \
            "${{ steps.stage.outputs.cask }}"

  install-the-cask:
    # The complaint this packaging exists to fix was "brew install leaves
    # nothing in the menu bar", and nothing short of installing it proves
    # otherwise. A cask has no `test do` block either, so this is where the
    # checks the old formula's test block used to make now live.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build and package
        run: ./scripts/package-release.sh
      - name: Stage the cask against that tarball
        id: stage
        run: echo "cask=$(./scripts/stage-cask-for-ci.sh)" >> "$GITHUB_OUTPUT"
      - name: Install it, and check what actually landed
        run: ./scripts/check-cask-install.sh "${{ steps.stage.outputs.cask }}"
      - name: Uninstall it
        run: |
          brew uninstall --cask "${{ steps.stage.outputs.cask }}"
          test ! -d /Applications/headless-spotify.app
