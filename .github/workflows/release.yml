name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Check VERSION matches tag
        run: |
          test "v$(tr -d ' \t\r\n' < VERSION)" = "${{ github.ref_name }}" || {
            echo "tag ${{ github.ref_name }} != VERSION $(cat VERSION)"; exit 1; }
      - name: Build release tarball
        run: ./scripts/package-release.sh
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/headless-spotify-*-macos.tar.gz
            dist/SHA256SUMS.txt
      - name: Bump formula to this release
        run: |
          VERSION="$(tr -d ' \t\r\n' < VERSION)"
          SHA="$(cut -d' ' -f1 < dist/SHA256SUMS.txt)"
          URL="https://github.com/Kathir-D/headless-spotify/releases/download/v$VERSION/headless-spotify-$VERSION-macos.tar.gz"
          python3 - "$SHA" "$URL" <<'EOF'
          import re, sys
          sha, url = sys.argv[1], sys.argv[2]
          p = "Formula/headless-spotify.rb"
          s = open(p).read()
          s = re.sub(r'url ".*"', f'url "{url}"', s)
          s = re.sub(r'sha256 ".*"', f'sha256 "{sha}"', s)
          open(p, "w").write(s)
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/headless-spotify.rb
          # A re-run for the same tag has nothing new to commit.
          if git diff --cached --quiet; then
            echo "Formula already points at v$VERSION."
            exit 0
          fi
          git commit -m "chore: bump formula to v$VERSION"
          # A tag-triggered checkout is a detached HEAD, so `git push` alone
          # fails with "You are not currently on a branch". Push the bump to
          # the default branch explicitly.
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
      # `brew install kathir-d/tap/headless-spotify` reads the formula from the
      # tap, not from this repo. TAP_DEPLOY_KEY is a deploy key with write
      # access to Kathir-D/homebrew-tap and nothing else.
      - name: Publish formula to the Homebrew tap
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          if [ -z "$TAP_DEPLOY_KEY" ]; then
            echo "::error::TAP_DEPLOY_KEY is not set, so the tap was not updated. The release is up; add the secret and re-run this job."
            exit 1
          fi
          KEY="$RUNNER_TEMP/tap_key"
          printf '%s\n' "$TAP_DEPLOY_KEY" > "$KEY" && chmod 600 "$KEY"
          export GIT_SSH_COMMAND="ssh -i $KEY -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone --depth 1 git@github.com:Kathir-D/homebrew-tap.git "$RUNNER_TEMP/tap"
          mkdir -p "$RUNNER_TEMP/tap/Formula"
          cp Formula/headless-spotify.rb "$RUNNER_TEMP/tap/Formula/headless-spotify.rb"
          cd "$RUNNER_TEMP/tap"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/headless-spotify.rb
          # A re-run for the same tag has nothing new to commit.
          if git diff --cached --quiet; then
            echo "The tap already has headless-spotify ${GITHUB_REF_NAME}."
            exit 0
          fi
          git commit -m "headless-spotify ${GITHUB_REF_NAME#v}"
          git push origin HEAD
